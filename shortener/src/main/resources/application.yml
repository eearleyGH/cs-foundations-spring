server:
  port: 8081

spring:
  application:
    name: shortener
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/shortener}
    username: ${DATABASE_USER:shortener}
    password: ${DATABASE_PASSWORD:shortener}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis

app:
  jwt:
    secret: ${JWT_SECRET:cs-foundations-spring-dev-secret-32b}
    issuer: cs-foundations-spring
    ttl-seconds: 3600
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}

logging:
  pattern:
    level: "trace=%X{traceId} %5p"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  tracing:
    enabled: false
